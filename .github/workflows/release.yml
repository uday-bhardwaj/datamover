name: release

env:
  JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
  JRELEASER_MAVENCENTRAL_TOKEN: ${{ secrets.OSSRH_PASSWORD }}
  JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
  JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
  JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}

on:
  push:
    branches:
      - master
      - dev
      - feature/*
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating tags and pushing version bumps
      packages: write  # Required for publishing to GitHub Packages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configure build steps as you'd normally do

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          server-id: central
          server-username: JRELEASER_MAVENCENTRAL_USERNAME
          server-password: JRELEASER_MAVENCENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: JRELEASER_GPG_PASSPHRASE
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Release to Maven Central
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.JRELEASER_MAVENCENTRAL_TOKEN }}
        run: |
            ./gradlew -Pprofile=sbom -PreproducibleBuild=true publishPlugins publish -S
            ./gradlew cleanupStagedRepository

      - name: Upload deploy artifacts
        uses: actions/upload-artifact@v4
        with:
            retention-days: 7
            name: deploy
            path: |
                  build/repos/local/release/

      - name: Run JReleaser
        uses: jreleaser/release-action@v2
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Persist logs

      - name: JReleaser release output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-release
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties