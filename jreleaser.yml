project:
  name: "DataMover"
  version: "0.3.0"  # Ensure this matches your project's versioning scheme
  description: "Simple framework for business data migration between applications."
  longDescription: "DataMover is a simple framework to migrate business data between applications."
  license: "MIT"
  links:
    homepage: "https://github.com/uday-bhardwaj/DataMover"
    documentation: "https://github.com/uday-bhardwaj/DataMover/wiki"
    license: "https://raw.githubusercontent.com/uday-bhardwaj/datamover/master/LICENSE"

release:
  github:
    owner: "uday-bhardwaj"
    name: "DataMover"
    tagName: "v{{projectVersion}}"
    releaseName: "DataMover {{projectVersion}}"
    overwrite: true
    draft: false
    sign: true

distributions:
  datamover-core:
    type: "SINGLE_JAR"
    artifacts:
      - path: "build/libs/datamover-core-{{projectVersion}}.jar"
    maven:
      groupId: "com.github.uday-bhardwaj"
      artifactId: "datamover-core"
      # JReleaser automatically detects snapshots based on the version string
      repositories:
        - id: "ossrh"
          url: "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
          snapshotUrl: "https://s01.oss.sonatype.org/content/repositories/snapshots/"
      signing:
        active: "{{isRelease()}}"