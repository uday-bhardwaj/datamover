project:
  name: "DataMover"
  version: "0.3.0-SNAPSHOT"  # Ensure this matches your project's versioning scheme
  snapshot:
    pattern: .*-SNAPSHOT
  java:
    groupId: "io.github.uday-bhardwaj.datamover"
  description: "Simple framework for business data migration between applications."
  longDescription: "DataMover is a simple framework to migrate business data between applications."
  license: "MIT"
  authors:
    - Aleksandr Ananev
    - Uday Bhardwaj
  copyright: Copyright (c) 2014 Aleksandr Ananev
  links:
    homepage: "https://github.com/uday-bhardwaj/DataMover"
    documentation: "https://github.com/uday-bhardwaj/DataMover/wiki"
    license: "https://raw.githubusercontent.com/uday-bhardwaj/datamover/master/LICENSE"

distributions:
  datamover-core:
    type: "SINGLE_JAR"
    java:
      groupId: "io.github.uday-bhardwaj.datamover"
    artifacts:
      - path: "/home/runner/work/datamover/datamover/components/datamover-core/build/libs/datamover-core-{{projectVersion}}.jar"