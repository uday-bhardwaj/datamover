project:
  name: "DataMover"
  version: 0.3.0  # Or use `${project.version}` to sync with Gradle
  snapshotPattern: "-SNAPSHOT"
  description: "Simple framework for business data migration between applications."
  longDescription: "DataMover is a simple framework to migrate business data between applications."
  license: MIT
  links:
    homepage: "https://github.com/uday-bhardwaj/DataMover"
    documentation: "https://github.com/uday-bhardwaj/DataMover/wiki"
    license: "https://raw.githubusercontent.com/uday-bhardwaj/datamover/master/LICENSE"

release:
  github:
    owner: "uday-bhardwaj"
    name: "DataMover"
    tagName: "{{projectVersion}}"
    releaseName: "DataMover {{projectVersion}}"
    overwrite: true
    draft: false
    sign: true

distributions:
  datamover-core:
    type: "JAR"
    artifacts:
      - path: "build/libs/datamover-core-{{projectVersion}}.jar"
    maven:
      active: ALWAYS
      deployAt: OSSRH
      url:
        snapshot: "https://s01.oss.sonatype.org/content/repositories/snapshots/"
        release: "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
      coordinates:
        groupId: "com.github.uday-bhardwaj"
        artifactId: "datamover-core"
      signing:
        active: ALWAYS